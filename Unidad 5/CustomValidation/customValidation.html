<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Custom JavaScript Validation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #eef1f5;
        padding: 40px;
      }
      form {
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 320px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      input,
      button {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 8px;
        font-size: 14px;
      }
      button {
        background: #28a745;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #218838;
      }
      .error {
        color: #d9534f;
        font-size: 13px;
        margin-top: -5px;
        margin-bottom: 8px;
      }
      .success {
        color: #28a745;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h2>Custom JavaScript Validation</h2>
    <form id="registerForm" novalidate>
      <label>Username:</label>
      <input type="text" id="username" />
      <div id="userError" class="error"></div>

      <label>Email:</label>
      <input type="text" id="email" />
      <div id="emailError" class="error"></div>

      <label>Password:</label>
      <input type="password" id="password" />
      <div id="passError" class="error"></div>

      <label>Confirm Password:</label>
      <input type="password" id="confirmPassword" />
      <div id="confirmError" class="error"></div>

      <button type="submit">Register</button>
      <div id="successMsg" class="success"></div>
    </form>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          // Get input values
          const username = document.getElementById("username").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirm = document.getElementById("confirmPassword").value;

          // Error elements
          const userErr = document.getElementById("userError");
          const emailErr = document.getElementById("emailError");
          const passErr = document.getElementById("passError");
          const confirmErr = document.getElementById("confirmError");
          const successMsg = document.getElementById("successMsg");

          // Clear previous errors
          userErr.textContent =
            emailErr.textContent =
            passErr.textContent =
            confirmErr.textContent =
            successMsg.textContent =
              "";

          let valid = true;

          // Username validation
          if (username.length < 3) {
            userErr.textContent = "Username must be at least 3 characters.";
            valid = false;
          }

          // Email validation (regex)
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailPattern.test(email)) {
            emailErr.textContent = "Please enter a valid email address.";
            valid = false;
          }

          // Password strength validation
          const passPattern =
            /^(?=.*\d)(?=.*[A-Z])(?=.*[a-z])(?=.*[!@#$%^&*]).{8,}$/;
          if (!passPattern.test(password)) {
            passErr.textContent =
              "Password must have at least 8 chars, uppercase, lowercase, number, and symbol.";
            valid = false;
          }

          // Confirm password match
          if (password !== confirm) {
            confirmErr.textContent = "Passwords do not match.";
            valid = false;
          }

          // Final success message
          if (valid) {
            successMsg.textContent = "Registration successful!";
            document.getElementById("registerForm").reset();
          }
        });
    </script>
  </body>
</html>
